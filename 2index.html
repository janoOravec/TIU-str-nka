<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moja stránka</title>

<style>
  #tlacidloKlik {
    font-size: 28px;
    padding: 20px 40px;
    border-radius: 40px;
    touch-action: manipulation;
  }

  #pocet {
    font-size: 48px;
    font-weight: bold;
  }

  #sprava {
    font-size: 24px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1 id="nadpis">Moja stránka</h1>

<button id="tlacidloNadpis">Zmeň nadpis</button>

<h1>Klikačka</h1>

<p id="info">Koľko klikov stihneš za 10 sekúnd?</p>

<button id="tlacidloKlik">Klikaj</button>

<p>Kliky: <span id="pocet">0</span></p>
<p id="sprava"></p>

<script>
const tlacidloNadpis = document.querySelector('#tlacidloNadpis');
const nadpis = document.querySelector('#nadpis');

tlacidloNadpis.addEventListener('click', () => {
  nadpis.textContent = 'Nový nadpis!';
});

const tlacidloKlik = document.querySelector('#tlacidloKlik');
const vypis = document.querySelector('#pocet');
const sprava = document.querySelector('#sprava');
const info = document.querySelector('#info');

let pocet = 0;
let spustene = false;
let koniec = false;

tlacidloKlik.addEventListener('click', () => {

  if (koniec) return;

  if (!spustene) {
    spustene = true;

    setTimeout(() => {
      koniec = true;
      tlacidloKlik.disabled = true;
      info.textContent = 'Čas vypršal! Obnov stránku a hraj znova.';
    }, 10000);
  }

  pocet++;
  vypis.textContent = pocet;

  if (pocet >= 70) {
    sprava.textContent = 'Legenda';
  } else if (pocet >= 40) {
    sprava.textContent = 'Raketa';
  } else {
    sprava.textContent = 'Slimák';
  }

});
</script>

</body>
</html>
